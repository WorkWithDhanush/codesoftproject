<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Smart Calculator</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#020617,#0f172a,#000000);
}

.calculator{
    width:400px;
    padding:25px;
    border-radius:25px;
    background:#111827;
    box-shadow:
        0 0 20px rgba(34,197,94,0.3),
        0 0 60px rgba(34,197,94,0.15);
    border:1px solid rgba(34,197,94,0.2);
}

h2{
    text-align:center;
    color:#22c55e;
    margin-bottom:20px;
    font-size:24px;
    font-weight:700;
    letter-spacing:1px;
}

#display{
    width:100%;
    height:75px;
    border:none;
    outline:none;
    border-radius:15px;
    background:#0f172a;
    color:#22c55e;
    text-align:right;
    font-size:30px;
    padding:15px;
    margin-bottom:18px;
    border:1px solid #22c55e;
    box-shadow:inset 0 0 15px rgba(34,197,94,0.25);
}

#display::placeholder{
    color:#86efac;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

button{
    height:55px;
    border:none;
    border-radius:14px;
    background:#1f2937;
    color:#ffffff;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#22c55e;
    color:#000;
    transform:translateY(-3px);
    box-shadow:0 0 15px rgba(34,197,94,0.6);
}

button:active{
    transform:scale(0.95);
}

.clear{
    background:#dc2626;
}

.clear:hover{
    background:#ef4444;
    color:white;
}

.equal{
    background:#22c55e;
    color:black;
    font-weight:bold;
}

.equal:hover{
    background:#4ade80;
}

.history-clear-btn{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:black;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.history-clear-btn:hover{
    background:#4ade80;
}

#history{
    margin-top:15px;
    background:#0f172a;
    border-radius:15px;
    padding:15px;
    max-height:150px;
    overflow-y:auto;
    color:#d1fae5;
    border:1px solid rgba(34,197,94,0.2);
}

#history div{
    padding:8px 0;
    border-bottom:1px solid rgba(34,197,94,0.15);
}

#history::-webkit-scrollbar{
    width:6px;
}

#history::-webkit-scrollbar-thumb{
    background:#22c55e;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="calculator">
    <h2>Advanced Smart Calculator</h2>

    <input type="text" id="display" placeholder="Enter expression..." />
    
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="append('(')">(</button>
        <button onclick="append(')')">)</button>
        <button onclick="append('/')">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('*')">×</button>
        <button onclick="powerPrompt()">xʸ</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('-')">−</button>
        <button onclick="square()">x²</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('+')">+</button>
        <button onclick="sqrt()">√x</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
        <button onclick="cuberoot()">³√x</button>
        <button onclick="percent()">%</button>

        <button onclick="factorial()">n!</button>
        <button onclick="reciprocal()">1/x</button>
    </div>

    <button id="clearHistoryBtn" class="history-clear-btn">Clear History</button>

    <div id="history"></div>
</div>

<script>
const display = document.getElementById("display");
const historyBox = document.getElementById("history");
const clearHistoryBtn = document.getElementById("clearHistoryBtn");

// Append value
function append(value) {
    display.value += value;
}

// Clear display
function clearDisplay() {
    display.value = "";
}

// Backspace
function backspace() {
    display.value = display.value.slice(0, -1);
}

// Calculate
function calculate() {
    try {
        let result = Function('"use strict";return (' + display.value + ')')();
        saveHistory(display.value + " = " + result);
        display.value = result;
        loadHistory();
    } catch {
        alert("Invalid expression");
    }
}

// Save history
function saveHistory(entry) {
    let history = JSON.parse(localStorage.getItem("calcHistory")) || [];
    history.push(entry);
    localStorage.setItem("calcHistory", JSON.stringify(history));
}

// Load history
function loadHistory() {
    let history = JSON.parse(localStorage.getItem("calcHistory")) || [];
    historyBox.innerHTML = "";
    history.slice().reverse().forEach(item => {
        let div = document.createElement("div");
        div.textContent = item;
        historyBox.appendChild(div);
    });
}

// Clear history
function clearHistory() {
    localStorage.removeItem("calcHistory");
    loadHistory();
    alert("History cleared!");
}

// Extra functions
function square() {
    let val = parseFloat(display.value);
    if (!isNaN(val)) display.value = val * val;
}

function sqrt() {
    let val = parseFloat(display.value);
    if (!isNaN(val)) display.value = Math.sqrt(val);
}

function cuberoot() {
    let val = parseFloat(display.value);
    if (!isNaN(val)) display.value = Math.cbrt(val);
}

function percent() {
    let val = parseFloat(display.value);
    if (!isNaN(val)) display.value = val / 100;
}

function factorial() {
    let n = parseInt(display.value);
    if (!isNaN(n) && n >= 0) {
        let fact = 1;
        for (let i = 2; i <= n; i++) fact *= i;
        display.value = fact;
    }
}

function reciprocal() {
    let val = parseFloat(display.value);
    if (!isNaN(val) && val !== 0) display.value = 1 / val;
}

function powerPrompt() {
    let base = parseFloat(display.value);
    let exponent = parseFloat(prompt("Enter exponent:"));
    if (!isNaN(base) && !isNaN(exponent)) display.value = Math.pow(base, exponent);
}

// Attach clear history event
clearHistoryBtn.addEventListener("click", clearHistory);

// Load history initially
loadHistory();
</script>

</body>
</html>
